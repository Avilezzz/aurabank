<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado del Servicio - Banca Web</title>
    <!-- Importación de Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

    <!-- BOTÓN PARA PROBAR (Simula que entras a la web) -->
    <button id="openModal" class="px-6 py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition">
        Entrar a Banca Web
    </button>

    <!-- ESTRUCTURA DEL MODAL -->
    <div id="modalOverlay" class="fixed inset-0 z-50 hidden transition-opacity">
        
        <!-- Backdrop (Fondo oscuro desenfocado) -->
        <div class="absolute inset-0 bg-gray-900/80 backdrop-blur-sm"></div>

        <!-- Contenedor del Modal -->
        <div class="relative flex items-center justify-center min-h-screen p-4">
            
            <div class="bg-white rounded-3xl shadow-2xl overflow-hidden max-w-md w-full transform transition-all scale-100">
                
                <!-- Barra superior de color (Indica error) -->
                <div class="h-2 bg-red-600"></div>

                <div class="p-8">
                    <!-- Icono de Advertencia Animado -->
                    <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-red-100 mb-6 animate-pulse">
                        <svg class="h-12 w-12 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                    </div>

                    <!-- Texto del Mensaje -->
                    <div class="text-center">
                        <h1 class="text-3xl font-black text-gray-900 uppercase tracking-tight mb-3">
                            Banca Web Caída
                        </h1>
                        <p class="text-lg text-gray-500 leading-relaxed">
                            Estamos realizando un mantenimiento de emergencia en nuestros servidores. 
                            <span class="block mt-2 font-bold text-red-600 underline">Vuelve a intentarlo mañana.</span>
                        </p>
                    </div>

                    <!-- Botón de Acción -->
                    <div class="mt-8">
                        <button id="closeModal" class="w-full py-4 bg-gray-900 text-white text-lg font-bold rounded-2xl hover:bg-gray-800 active:scale-95 transition-all shadow-lg">
                            ENTENDIDO
                        </button>
                    </div>

                    <!-- Pie de página del modal -->
                    <p class="mt-4 text-center text-xs text-gray-400">
                        Código de error: 503 SERVICE_UNAVAILABLE
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- LÓGICA DE APERTURA Y CIERRE -->
    <script>
        const modal = document.getElementById('modalOverlay');
        const btnOpen = document.getElementById('openModal');
        const btnClose = document.getElementById('closeModal');

        // Función para abrir
        btnOpen.onclick = () => {
            modal.classList.remove('hidden');
        };

        // Función para cerrar
        btnClose.onclick = () => {
            modal.classList.add('hidden');
        };

        // Cerrar si hacen clic fuera del cuadro blanco
        window.onclick = (event) => {
            if (event.target == modal.querySelector('.relative')) {
                modal.classList.add('hidden');
            }
        };
    </script>

</body>
</html>
